<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foresight — Research that remembers</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui; background: #0b1020; color: #e9eefc; }
      body { max-width: 1180px; margin: 0 auto; padding: 32px 20px 60px; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
      h1 { font-size: clamp(2rem, 5vw, 4.2rem); line-height: .95; margin: 0; letter-spacing: -.06em; }
      .muted { color: #92a0c3; } .eyebrow { color: #78e4c2; text-transform: uppercase; letter-spacing: .16em; font-size: .72rem; font-weight: 700; }
      .search { display: flex; gap: 8px; } input, button { border: 1px solid #2c3a5f; border-radius: 10px; background: #121a31; color: inherit; padding: 12px 14px; font: inherit; }
      button { background: #78e4c2; color: #07131a; font-weight: 800; cursor: pointer; } button:hover { filter: brightness(1.08); }
      .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; } .card { background: #121a31; border: 1px solid #263454; border-radius: 16px; padding: 18px; grid-column: span 4; }
      .wide { grid-column: span 8; } .full { grid-column: 1 / -1; } .label { color: #92a0c3; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
      .score { font-size: 3.5rem; font-weight: 800; color: #78e4c2; } .bar { height: 8px; background: #263454; border-radius: 99px; overflow: hidden; margin: 8px 0 12px; } .bar i { display: block; height: 100%; background: #78e4c2; }
      li { margin: 10px 0; line-height: 1.4; } a { color: #a7b7ff; } .status { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #273b58; font-size: .75rem; }
      @media (max-width: 820px) { .card, .wide { grid-column: 1 / -1; } header { display: block; } .search { margin-top: 20px; } }
    </style>
  </head>
  <body>
    <header>
      <div><div class="eyebrow">Memory-backed market research</div><h1>Foresight</h1><p class="muted">Why it moved. What must happen next. What history says.</p></div>
      <form class="search" id="form"><input id="asset" value="PLTR" aria-label="Asset ticker" /><input id="target" type="number" value="40" aria-label="Target price" /><button>Research</button></form>
    </header>
    <main id="report"><p class="muted">Loading research...</p></main>
    <script>
      const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
      const list = values => `<ul>${values.map(value => `<li>${esc(value)}</li>`).join('')}</ul>`;
      const render = r => {
        const groups = Object.entries(r.confidence.groups).map(([name, score]) => `<div class="label">${esc(name)} · ${score}</div><div class="bar"><i style="width:${score}%"></i></div>`).join('');
        const drivers = r.drivers.map(d => `<li><b>${esc(d.category)}</b> · ${Math.round(d.share*100)}% — ${esc(d.summary)}<br>${d.evidence.map(e => `<a href="${esc(e.url)}" target="_blank">${esc(e.source)}</a>`).join(' · ')}</li>`).join('');
        const conditions = r.roadmap.conditions.map(c => `<li><span class="status">${esc(c.status)}</span> ${esc(c.description)}</li>`).join('');
        return `<section class="grid">
          <div class="card wide"><div class="label">${esc(r.asset)} · move</div><div class="score">${esc(r.move.pct)}%</div><p>${esc(r.confidence.explanation)}</p></div>
          <div class="card"><div class="label">Confidence · ${esc(r.confidence.regime)}</div><div class="score">${esc(r.confidence.score)}</div><p class="muted">${esc(r.confidence.available_signals)} / ${esc(r.confidence.signal_count)} signals available</p>${groups}</div>
          <div class="card"><div class="label">Memory used</div>${list(r.memory_used.map(m => `${m.type}: ${m.summary}`))}</div>
          <div class="card wide"><div class="label">Why it moved</div><ul>${drivers}</ul></div>
          <div class="card"><div class="label">Facts vs reality</div><p>${esc(r.facts_vs_reality.verdict)}</p><p class="muted">${esc(r.facts_vs_reality.market_view)}</p></div>
          <div class="card full"><div class="label">What must happen next</div><p>${esc(r.roadmap.success_definition)}</p><ul>${conditions}</ul><p class="muted">${esc(r.thesis_check)}</p></div>
          <div class="card"><div class="label">Leadership</div><h2>${esc(r.leadership.overall_grade)}</h2>${list(r.leadership.data_gaps)}</div>
          <div class="card wide"><div class="label">Deep research</div><p><b>Company:</b> ${esc(r.deep_research.company)}</p><p><b>Sector:</b> ${esc(r.deep_research.sector)}</p><p><b>Macro:</b> ${esc(r.deep_research.macro)}</p></div>
          <div class="card full"><small class="muted">${esc(r.disclaimer)}</small></div>
        </section>`;
      };
      async function load() { const asset = document.getElementById('asset').value.trim(); const target = document.getElementById('target').value; document.getElementById('report').innerHTML = '<p class="muted">Recalling dossier, fetching sources, scoring patterns...</p>'; const res = await fetch(`/api/report/${encodeURIComponent(asset)}?target_price=${target}`); document.getElementById('report').innerHTML = res.ok ? render(await res.json()) : `<p>Research failed: ${esc(await res.text())}</p>`; }
      document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); load(); }); load();
    </script>
  </body>
</html>
