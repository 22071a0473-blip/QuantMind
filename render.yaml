services:
  - type: web
    name: quantmind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HINDSIGHT_API_URL
        sync: false
      - key: HINDSIGHT_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: HINDSIGHT_BANK_PREFIX
        value: quantmind-
      - key: TAVILY_API_KEY
        sync: false
      - key: FORESIGHT_CACHE_TTL_SECONDS
        value: "300"
      - key: FORESIGHT_LOG_LEVEL
        value: INFO
      - key: FORESIGHT_SEC_USER_AGENT
        sync: false
