services:
  - type: web
    name: quantmind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HINDSIGHT_API_URL
        sync: false
      - key: HINDSIGHT_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FORESIGHT_SEC_USER_AGENT
        sync: false
