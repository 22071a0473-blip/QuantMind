services:
  - type: web
    name: quantmind
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HINDSIGHT_API_URL
        sync: false
      - key: HINDSIGHT_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FORESIGHT_SEC_USER_AGENT
        sync: false
