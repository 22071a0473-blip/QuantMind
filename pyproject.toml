[project]
name = "foresight"
version = "0.1.0"
description = "Memory-backed company research analyst built on Hindsight"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "hindsight-client>=0.10.1",
  "aiohttp>=3.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
