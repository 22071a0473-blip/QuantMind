[project]
name = "foresight"
version = "0.1.0"
description = "Memory-backed company research analyst built on Hindsight"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "hindsight-client>=0.10.1",
  "groq>=0.30",
  "jinja2>=3.1",
  "pycoingecko>=3.2",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
