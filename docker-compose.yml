services:
  foresight:
    build: .
    environment:
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-http://host.docker.internal:8888}
      HINDSIGHT_API_TOKEN: ${HINDSIGHT_API_TOKEN:-}
      HINDSIGHT_BANK_PREFIX: ${HINDSIGHT_BANK_PREFIX:-quantmind-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FORESIGHT_DEMO_MODE: ${FORESIGHT_DEMO_MODE:-true}
    ports:
      - "8000:8000"
    command: ["uvicorn", "foresight.app:app", "--host", "0.0.0.0", "--port", "8000"]
